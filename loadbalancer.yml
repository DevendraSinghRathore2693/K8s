apiVersion: v1
kind: Namespace
metadata:
  name: mytestns
---
apiVersion: v1
kind: Pod
metadata:
  name: mytestpod
  namespace: mytestns
  labels:
    app: mytestapp
spec:
  containers:
    - name: mytestcontainers
      image: nginx:latest
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: mytest-lb
  namespace: mytestns
spec:
  type: LoadBalancer
  selector:
    app: mytestapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80