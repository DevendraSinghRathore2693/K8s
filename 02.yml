apiVersion: v1
kind: pod
metadata:
  name: myapp
  labels:
  app: myapp
spec:
containers:
- name: myappcontainer
  image: myappimage:v1
  ports:
  - containerPort: 80

---
apiVersion: v1
kind: services
metadata: 
  name: myappservice
spec:
  selector:
    app: myapp
  ports:
  - protocol: TCP
    port: 80