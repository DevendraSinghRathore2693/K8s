apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
  app: myapp
spec:
  containers:
    - name: myappcontainer
      image: myappimage:v1
      volumemounts:
        - name: myappvol
          mountPath: /data
      ports:
        - containerPort: 80
  volumes:
    - name: myappvol
      emptyDir: {}

---
apiVersion: v1
kind: Service
metadata: 
  name: myappservice
spec:
  selector:
    app: myapp
  ports:
volumes:
  - name: myappvol
    emptyDir: {}
